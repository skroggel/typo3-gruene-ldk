    <html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true"
>
    <section class="card-slider instagram-slider csp-section csp-not-last csp-section-padding fullwidth-1 bg-color-{data.madj2k_background_color} js-appear-on-scroll" id="c{data.uid}">

        <div class="container-xxxl">
            <div class="row justify-content-center">
                <div class="col-12 col-xxl-10">

                    <f:render partial="Utils/Header"
                              arguments="{header: data.madj2k_header, wrapClass: 'instagram-slider-headline',
                                          layout: headerLayout, settings: settings}" />

                    <f:render partial="Utils/Bodytext"
                              arguments="{text: data.bodytext, wrapClass: 'instagram-slider-text  mb-7'}" />

                </div>

                <div class="col-12">
                    <f:if condition="{data._grids.plugin_instagram_slider}">
                        <f:if condition="{data._grids.plugin_instagram_slider.0.content -> f:format.trim()}">
                            <div class="card-slider-wrap instagram-slider-wrap swiper js-card-slider js-loop js-autoplay"
                                 data-prev-slide-message="{f:translate(key: 'label.previousSlide', extensionName: 'SiteDefault')}"
                                 data-next-slide-message="{f:translate(key: 'label.nextSlide', extensionName: 'SiteDefault')}"
                            >
                                <f:for each="{data._grids.plugin_instagram_slider}" as="item" iteration="i">
                                    <f:comment><!-- {item.data} contains the Content Block data object. --></f:comment>
                                    <f:format.raw>{item.content}</f:format.raw>
                                </f:for>
                            </div>
                        </f:if>
                    </f:if>
                </div>
            </div>
        </div>

    </section>
</html>
