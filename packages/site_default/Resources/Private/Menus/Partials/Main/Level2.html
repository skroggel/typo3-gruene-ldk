<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true"
>

    <f:if condition="!{column}">
        <f:variable name="column" value="all" />
    </f:if>
    <f:for each="{menuItems}" as="menuItem" iteration="iterator">
        <f:variable name="title">{f:if(condition: '{noHtml}', then: '{menuItem.data.title}', else: '{menuItem.title}')}</f:variable>

        <f:if condition="({column} == 'odd' && {iterator.isOdd}) || ({column} == 'even' && {iterator.isEven}) || ({column} == 'all')">
            <li class="nav-main-item level-2{f:if(condition: '{menuItem.active} && {menuItem.data.doktype} != \'4\'', then: ' active')}">

                <f:if condition="{menuItem.children}">
                    <f:then>
                        <div class="nav-main-link level-2" role="heading">
                            <span class="headline"><span><f:format.html
                                parseFuncTSPath="lib.parseFunc_Inline">{title}</f:format.html></span></span>
                        </div>

                        <ul class="nav-main-list level-3" role="menu">
                            <f:render partial="Level3" arguments="{menuItems: menuItem.children, parentItem: menuItem}" />
                        </ul>
                    </f:then>

                    <f:else>

                        <a class="nav-main-link level-2{f:if(condition:'{menuItem.active} && {menuItem.data.doktype} != \'4\'', then:' active')}"
                           href="{f:if(condition:'{menuItem.data.tx_klarokratie_open_modal}', then:'#', else :'{menuItem.link}')}"
                           {f:if(condition:'{menuItem.data.tx_klarokratie_open_modal}', then:'onclick="javascript:klaro.show(undefined, true);return false;"')}
                           target="{menuItem.target}"
                           title="{menuItem.data.title}"
                           role="menuitem"
                        >
                            <span class="headline"><span><f:format.html
                                parseFuncTSPath="lib.parseFunc_Inline">{title}</f:format.html></span>
                            </span>
                        </a>
                    </f:else>
                </f:if>
            </li>
        </f:if>
    </f:for>



</html>
