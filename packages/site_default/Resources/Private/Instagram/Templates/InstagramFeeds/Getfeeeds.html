<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

    <f:flashMessages />
    <f:if condition="{instauser} && {instamedia}">
        <div class="swiper-wrapper">
            <f:for each="{instamedia}" as="instaItem" iteration="iterator">

                <f:render
                    partial="Graphapiview/Instamedia"
                    arguments="{
                            instamedia: instamedia,
                            settings: settings
                        }"
                />

            </f:for>
        </div>

        <!-- If we need navigation buttons -->
        <f:if condition="{instamedia -> f:count() > 1}">

            <!-- If we need navigation buttons -->
            <div class="swiper-navigation">
                <div class="cta cta-icon-only cta-inverted cta-prev js-prev"></div>
                <div class="cta cta-icon-only cta-inverted cta-next js-next"></div>
            </div>


            <div class="card-slider-navigation mt-5 mb-2">
                <f:render partial="Utils/Cta"
                          arguments="{
                                label: '{f:translate(key: \'label.showAll\', extensionName: \'SiteDefault\')}',
                                link: 'https://instagram.com/{instamedia.0.username}',
                                target: '_blank',
                                type: 'inverted',
                                class: 'card-slider-cta cta-inverted',
                                icon: 'instagram',
                                settings: settings
                          }" />
            </div>
        </f:if>
    </f:if>
</html>
