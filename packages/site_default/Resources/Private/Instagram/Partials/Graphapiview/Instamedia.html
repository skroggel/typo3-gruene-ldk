<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

    <f:for each="{instamedia}" as="instadata" iteration="i">

        <f:comment><!-- Different urls needed --></f:comment>
        <f:if condition="{instadata.media_type} == 'VIDEO'">
            <f:then>
                <f:variable name="imageUrl" value="{instadata.thumbnail_url}" />
            </f:then>
            <f:else>
                <f:variable name="imageUrl" value="{instadata.media_url}" />
            </f:else>
        </f:if>

        <f:comment><!-- Overlay-stuff --></f:comment>
        <f:variable name="mediaOverlay">
            <f:render
                section="mediaOverlay"
                arguments="{_all}"
            />
        </f:variable>


        <f:variable name="postDate" value="{instadata.timestamp -> f:format.date(format: '{f:translate(key: \'instagram.dateFormat\', extensionName: \'SiteDefault\')}')}" />
        <f:variable name="postTime" value="{instadata.timestamp -> f:format.date(format: '{f:translate(key: \'instagram.timeFormat\', extensionName: \'SiteDefault\')}')}" />

        <f:render
            partial="Utils/Tile"
            arguments="{
                imageUrl: imageUrl,
                imageAlt: instadata.caption,
                header: '',
                subline: '{postDate} {postTime}',
                text: instadata.caption,
                wrapClass: 'swiper-slide tile-slider',
                link: instadata.permalink,
                target: '_blank',
                mediaOverlay: mediaOverlay,
                settings: settings
            }"
        />

    </f:for>

    <f:comment><!-- ========================================================= --></f:comment>
    <f:section name="mediaOverlay">

        <f:switch expression="{instadata.media_type}">
            <f:case value="CAROUSEL_ALBUM">
                <div class="tile-image-type">

                    <span class="visually-hidden">
                        <f:translate
                            key="instagram.gallery"
                            extensionName="ns_instagram"
                        />
                    </span>

                    <svg
                        class="clone-icon"
                        viewBox="0 0 115.77 122.88"
                        width="50"
                        aria-hidden="true"
                    >
                        <path
                            fill="currentColor"
                            d="M89.62 13.96v7.73h12.2v.02c3.85.01 7.34 1.57 9.86 4.1 2.5 2.51 4.06 5.98 4.07 9.82h.02v73.3h-.02c-.01 3.84-1.57 7.33-4.1 9.86-2.51 2.5-5.98 4.06-9.82 4.07v.02H40.1v-.02c-3.84-.01-7.34-1.57-9.86-4.1-2.5-2.51-4.06-5.98-4.07-9.82h-.02V92.51h-12.2v-.02c-3.84-.01-7.34-1.57-9.86-4.1-2.5-2.51-4.06-5.98-4.07-9.82H0V13.95h.02c.01-3.85 1.58-7.34 4.1-9.86C6.63 1.59 10.1.03 13.94.02V0H75.67v.02c3.85.01 7.34 1.57 9.86 4.1 2.5 2.51 4.06 5.98 4.07 9.82h.02v.02zm-10.58 7.73v-7.75h.02c0-.91-.39-1.75-1.01-2.37-.61-.61-1.46-1-2.37-1v.02H13.95v-.02c-.91 0-1.75.39-2.37 1.01-.61.61-1 1.46-1 2.37h.02v64.62h-.02c0 .91.39 1.75 1.01 2.37.61.61 1.46 1 2.37 1v-.02h12.2V35.64h.02c.01-3.85 1.58-7.34 4.1-9.86 2.51-2.5 5.98-4.06 9.82-4.07v-.02H79.04zm26.14 87.23V35.63h.02c0-.91-.39-1.75-1.01-2.37-.61-.61-1.46-1-2.37-1v.02H40.09v-.02c-.91 0-1.75.39-2.37 1.01-.61.61-1 1.46-1 2.37h.02v73.3h-.02c0 .91.39 1.75 1.01 2.37.61.61 1.46 1 2.37 1v-.02H101.83v.02c.91 0 1.75-.39 2.37-1.01.61-.61 1-1.46 1-2.37h-.02v-.01z"
                            clip-rule="evenodd"
                        />
                    </svg>
                </div>
            </f:case>

            <f:case value="VIDEO">
                <div class="tile-image-type">
                    <span class="visually-hidden">
                        <f:translate
                            key="instagram.video"
                            extensionName="ns_instagram"
                        />
                    </span>

                    <svg
                        class="video-icon"
                        viewBox="0 0 122.88 111.34"
                        width="50"
                        aria-hidden="true"
                    >
                        <path
                            fill="currentColor"
                            d="M23.59 0h75.7a23.68 23.68 0 0123.59 23.59v64.16a23.56 23.56 0 01-6.88 16.66l-.22.2a23.53 23.53 0 01-16.44 6.73H23.59a23.53 23.53 0 01-16.66-6.93l-.2-.22A23.46 23.46 0 010 87.75V23.59A23.66 23.66 0 0123.59 0zM54 47.73l25.25 17.63a3.79 3.79 0 01.14 6.3L54.22 89.05a3.75 3.75 0 01-2.4.87A3.79 3.79 0 0148 86.13V50.82a3.77 3.77 0 016-3.09zM7.35 26.47h14l9.06-19.12h-6.82A16.29 16.29 0 007.35 23.59v2.88zm29.7-19.12L28 26.47h25.36l9.07-19.09zm32 0l-9.13 19.12h24.7L93.7 7.35zm31.32 0l-9.11 19.12h24.27v-2.88a16.32 16.32 0 00-15.2-16.21zm15.2 26.68H7.35v53.72A16.21 16.21 0 0012 99.05l.17.16A16.19 16.19 0 0023.59 104h75.7a16.21 16.21 0 0011.3-4.6l.16-.18a16.17 16.17 0 004.78-11.46v-53.7z"
                        />
                    </svg>
                </div>
            </f:case>
        </f:switch>

    </f:section>
</html>
