<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:madj2k="http://typo3.org/ns/Madj2k/SiteDefault/ViewHelpers/Format"
      data-namespace-typo3-fluid="true">

    <f:if condition="!{variant}">
        <f:variable name="variant" value="default" />
    </f:if>

    <div class="tag-list variant-{variant}">
        <f:spaceless>
            <span class="tag">
                <span class="icon-calendar icon"></span><span><madj2k:timeRange
                startDate="{newsItem.datetime}"
                stopDate="{newsItem.txSitedefaultDatetimeEnd}"
                dateFormat="{f:translate(key:'news.dateFormat', extensionName:'site_default')}"
                timeFormat="{f:translate(key:'news.timeFormat', extensionName:'site_default')}"
            /></span>
            </span>
            <f:if condition="{newsItem.txSitedefaultLocation}">
                <span class="tag">
                    <span class="icon-location icon"></span><span>{newsItem.txSitedefaultLocation}</span>
                </span>
            </f:if>
            <f:if condition="{newsItem.categories} && ({newsItem.type} != '3' || {variant} != 'big')">
                <span class="tag">
                    <span class="icon-news icon"></span><span><f:render partial="Category/ItemsImploded"
                                                                       arguments="{categories:newsItem.categories, settings: customSettings}" /></span>
                </span>
            </f:if>
        </f:spaceless>
    </div>
</html>
