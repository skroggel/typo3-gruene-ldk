<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      xmlns:siteDefault="http://typo3.org/ns/Madj2k/SiteDefault/ViewHelpers"
      data-namespace-typo3-fluid="true">

	<f:layout name="List" />

    <f:section name="TopicSlider">
        <f:if condition="{pagination.paginator.paginatedItems}">
            <div class="swiper-wrapper">
                <f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">

                    <f:variable name="categories"
                                value="{f:render(partial: 'Category/ItemsImploded',
                                        arguments:'{categories: newsItem.categories, settings: settings, customSettings: settings.list._custom.topicSlider}')}" />

                    <f:if condition="{newsItem.externalurl}">
                        <f:then>
                            <f:variable name="linkToNewsDetail" value="0" />
                            <f:variable name="link" value="{newsItem.externalurl}" />
                        </f:then>
                        <f:else>
                            <f:variable name="linkToNewsDetail" value="{settings.detailPid}" />
                            <f:variable name="link" value="{newsItem.uid}" />
                        </f:else>
                    </f:if>

                    <f:render partial="Utils/Tile" arguments="{
                         image: newsItem.txSitedefaultImagePreview.0,
                         header: newsItem.title,
                         subline: categories,
                         text: newsItem.teaser,
                         wrapClass: 'swiper-slide tile-slider',
                         linkToNewsDetail: linkToNewsDetail,
                         link: link,
                         settings: settings.list._custom.topicSlider
                    }" />
                </f:for>
            </div>

            <!-- If we need navigation buttons -->
            <f:if condition="{pagination.paginator.paginatedItems -> f:count() > 1}">

                <div class="card-slider-navigation mt-5 mb-2">
                    <f:render partial="Utils/Cta"
                              arguments="{
                                    label: '{f:translate(key: \'label.nextTopic\', extensionName: \'SiteDefault\')}',
                                    type: 'inverted',
                                    class: 'card-slider-cta js-card-slider-next',
                                    icon: 'reload',
                                    settings: settings.list._custom.topicSlider
                              }" />
                </div>
            </f:if>
        </f:if>

    </f:section>

    <f:comment><!-- ============================================================= --> </f:comment>

    <f:section name="NewsSlider">
        <f:if condition="{pagination.paginator.paginatedItems}">
            <div class="swiper-wrapper">
                <f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">

                    <f:variable name="categories"
                                value="{f:render(partial: 'Category/ItemsImploded',
                                        arguments:'{categories: newsItem.categories, settings: settings, customSettings: settings.list._custom.topicSlider}')}" />

                    <f:if condition="{newsItem.externalurl}">
                        <f:then>
                            <f:variable name="linkToNewsDetail" value="0" />
                            <f:variable name="link" value="{newsItem.externalurl}" />
                        </f:then>
                        <f:else>
                            <f:variable name="linkToNewsDetail" value="{settings.detailPid}" />
                            <f:variable name="link" value="{newsItem.uid}" />
                        </f:else>
                    </f:if>

                    <f:render partial="Utils/Tile" arguments="{
                         image: newsItem.txSitedefaultImagePreview.0,
                         header: newsItem.title,
                         subline: categories,
                         text: newsItem.teaser,
                         wrapClass: 'swiper-slide tile-slider',
                         linkToNewsDetail: linkToNewsDetail,
                         link: link,
                         settings: settings.list._custom.topicSlider
                    }" />
                </f:for>
            </div>

            <!-- If we need navigation buttons -->
            <f:if condition="{settings.listPid}">

                <div class="swiper-navigation">
                    <div class="cta cta-icon-only cta-inverted cta-prev js-prev"></div>
                    <div class="cta cta-icon-only cta-inverted cta-next js-next"></div>
                </div>

                <div class="card-slider-navigation mt-5 mb-2">
                    <f:render partial="Utils/Cta"
                              arguments="{
                                    link: '{f:uri.page(pageUid: settings.listPid)}',
                                    label: '{f:translate(key: \'label.showAll\', extensionName: \'SiteDefault\')}',
                                    type: 'inverted',
                                    icon: 'news',
                                    class: 'card-slider-cta',
                                    settings: settings.list._custom.topicSlider
                              }" />
                </div>
            </f:if>
        </f:if>

    </f:section>

    <f:comment><!-- ============================================================= --> </f:comment>

	<f:section name="Default">


		<!--TYPO3SEARCH_end-->
		<f:if condition="{news}">

            <f:if condition="{settings.templateLayout} != '3'">
                <div class="news-filter page-padding" id="news-filter-{contentObjectData.uid}">
                    <div class="container-xxxl">
                        <div class="row">
                            <div class="col-12">

                                <ul class="nav-inline-list news-filter-list">
                                    <f:comment><!-- Reset
                                    <li class="nav-inline-item news-filter-item {f:if(condition: '{overwriteDemand.types.0} == \'\'', then: 'active')}">
                                        <f:link.action action="list"
                                                       arguments="{overwriteDemand: {types: {}}}"
                                                       section="news-items-{contentObjectData.uid}"
                                                       class="nav-inline-link news-filter-link js-no-scroll">
                                           <f:translate key="news.showAllTypes" extensionName="siteDefault" />
                                        </f:link.action>
                                    </li>--></f:comment>

                                    <!-- Default news -->
                                    <li class="nav-inline-item news-filter-item {f:if(condition: '{overwriteDemand.types.0} == \'0\' || !{overwriteDemand.types.0}', then: 'active')}">
                                        <f:link.action action="list"
                                                       arguments="{
                                                            overwriteDemand: {
                                                                types: {0: 0}
                                                            }
                                                       }"
                                                       section="news-items-{contentObjectData.uid}"
                                                       class="nav-inline-link news-filter-link js-no-scroll">
                                            <f:translate key="news.showNews" extensionName="siteDefault" />
                                        </f:link.action>
                                    </li>

                                    <!-- Events -->
                                    <li class="nav-inline-item news-filter-item {f:if(condition: '{overwriteDemand.types.0} == \'3\'', then: 'active')}">
                                        <f:link.action action="list"
                                                       arguments="{
                                                            overwriteDemand: {
                                                                types: {0: 3},
                                                                order: 'datetime asc'
                                                            }
                                                       }"
                                                       section="news-items-{contentObjectData.uid}"
                                                       class="nav-inline-link news-filter-link js-no-scroll">
                                            <f:translate key="news.showEvents" extensionName="siteDefault" />
                                        </f:link.action>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </f:if>

            <div class="news-items" id="news-items-{contentObjectData.uid}">
                <f:if condition="{settings.list.paginate.insertAbove}">
                    <f:render partial="List/Pagination"
                              arguments="{pagination: pagination.pagination, paginator: pagination.paginator,
                                          contentObjectData: contentObjectData, settings: settings,
                                          customSettings: settings.list._custom.listGrouped}" />
                </f:if>

                <f:for each="{siteDefault:news.groupByMonth(news:pagination.paginator.paginatedItems)}"
                       as="group"
                       iteration="iterator"
                >

                    <f:if condition="{group.isFirstOfYear}">
                        <f:then>
                            <f:variable name="formatedDate" ><siteDefault:format.localizedDate
                                date="{group.date}"
                                format="{f:translate(key:'news.headerDateFormatFirstOfYear', extensionName:'siteDefault')}" /></f:variable>
                        </f:then>
                        <f:else>
                            <f:variable name="formatedDate" ><siteDefault:format.localizedDate
                                date="{group.date}"
                                format="{f:translate(key:'news.headerDateFormat', extensionName:'siteDefault')}" /></f:variable>
                        </f:else>
                    </f:if>

                    <div class="page-padding news-items-group{f:if(condition: iterator.isEven, then: ' is-even', else: ' is-odd')}">
                        <div class="container-xxxl">
                            <div class="row">
                                <div class="col-12">
                                    <f:render partial="Utils/Header"
                                              arguments="{header: formatedDate, wrapClass: 'news-items-header',
                                              settings: settings.list._custom.listGrouped}" />

                                    <f:for each="{group.items}" as="newsItem">
                                        <f:render partial="List/ListItem"
                                                  arguments="{newsItem: newsItem, settings: settings, customSettings: settings.list._custom.listItem}" />
                                    </f:for>
                                </div>
                            </div>
                        </div>

                    </div>
                </f:for>

                <f:if condition="{settings.list.paginate.insertBelow}">
                    <f:render partial="List/Pagination"
                              arguments="{pagination: pagination.pagination, paginator: pagination.paginator,
                                          contentObjectData: contentObjectData, settings: settings,
                                          customSettings: settings.list._custom.listGrouped}" />
                </f:if>
            </div>
		</f:if>
		<!--TYPO3SEARCH_begin-->
	</f:section>

</html>
