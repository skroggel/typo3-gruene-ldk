<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true"
>

    <div class="socialmedia">
        <p class="socialmedia-headline headline h5 text-color-inverted" role="heading">
            <f:translate key="socialMedia.headline" extensionName="siteDefault" />
        </p>
        <div class="socialmedia-list text-color-inverted">
            <f:for each="{
            facebook: 'https://de-de.facebook.com/grueneWZ/',
            instagram: 'https://www.instagram.com/gruene_wetzlar/',
            youtube: 'https://www.youtube.com/watch?v=Vb_MIUOuH9g&embeds_referring_euri=https%3A%2F%2Fgruene-wetzlar.de%2F&feature=emb_imp_woyt'
        }" as="url" key="icon">
                <a href="{url}"
                   title="{f:translate(key: 'socialMedia.{icon}', extensionName:'siteDefault')}"
                   target="_blank"
                   class="socialmedia-link link"
                   rel="nofollow"><span class="icon-{icon ->f:format.case(mode: 'lower')} icon"></span></a>
            </f:for>
        </div>
    </div>
</html>
